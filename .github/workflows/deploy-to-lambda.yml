# Name of your workflow (you'll see this in the "Actions" tab)
name: Build and Deploy to AWS Lambda

# The "Trigger": This runs when you push to the 'main' branch
on:
  push:
    branches:
      - dev  # <-- TODO: Change this to 'master' if that's your branch name

jobs:
  build-and-deploy:
    # This job runs on a virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      # This downloads your GitHub repo code onto the VM
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Set up the Java environment
      # This installs Java (JDK 17) and Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the .jar file (The "CI" step)
      # This runs the same 'mvn' command you run locally
      - name: Build with Maven
        run: mvn clean package

      # 4. Configure AWS Credentials
      # This securely logs into AWS using the Secrets you created
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1  # <-- TODO: Change this to your Lambda's region (ap-south-1 is Mumbai)

      # 5. Deploy the .jar to Lambda (The "CD" step)
      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://target/myJavaCaller-1.0.jar \
            --publish
        # -----------------------------------------------------------------
        # !! IMPORTANT !!
        # TODO: Change 'myJavaCaller-1.0.jar' to the exact name of
        # the .jar file that 'mvn package' creates in your 'target' folder!
        # The 'fileb://' prefix is required.
        # -----------------------------------------------------------------