# Name of your workflow (you'll see this in the "Actions" tab)
name: Build and Deploy to AWS Lambda

# The "Trigger": This runs when you push to the 'main' branch
on:
  push:
    branches:
      - dev  # <-- TODO: Change this to 'master' if that's your branch name

jobs:
  build-and-deploy:
    # This job runs on a virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Set up the Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the "thin" .jar file
      # This is now much faster (no shade plugin)
      - name: Build with Maven
        run: mvn clean package

      # 4. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1  # <-- TODO: Change this if not ap-south-1

      # 5. NEW STEP: Attach the Layer to the Lambda
      # This updates the function's configuration to use the Layer
      - name: Configure Lambda Layers
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --layers ${{ secrets.MY_JAVA_LAYER_ARN }}

      # 6. Deploy the "thin" .jar file (the "briefcase")
      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://target/my-java-lambda-1.0.jar \
            --publish
        # -----------------------------------------------------------------
        # !! IMPORTANT !!
        # TODO: Change 'javaLambdaF1-1.0.jar' to the exact name of
        # the .jar file 'mvn package' creates in your 'target' folder!
        # It's based on the <artifactId> in your pom.xml.
        # -----------------------------------------------------------------